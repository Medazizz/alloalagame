# Allo..Ala — à inclure dans le bloc server { … } HTTPS de alloala.com :
#     include snippets/alloala.conf;

# --- Le jeu : https://alloala.com/jeu/ (serveur Node sur le port 3010) ---
location = /jeu { return 301 /jeu/; }
location /jeu/ {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64k;
}

# --- La page du QR code : https://alloala.com/qrcode/ (fichiers statiques) ---
location = /qrcode { return 301 /qrcode/; }
location /qrcode/assets/ {
    alias /var/www/alloala-qrcode/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
}
location /qrcode/ {
    alias /var/www/alloala-qrcode/;
    index index.html;
    try_files $uri $uri/ =404;
}
